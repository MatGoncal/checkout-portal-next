name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          API_KEY: demo-partner-key
          WEBHOOK_SECRET: dev-webhook-secret
      - name: Verify the client bundle carries no server credential
        run: bash scripts/check-client-bundle.sh
        env:
          API_KEY: demo-partner-key
          WEBHOOK_SECRET: dev-webhook-secret

  contract-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify API contract files match canonical baseline
        run: bash scripts/check-contract-drift.sh

  e2e:
    runs-on: ubuntu-latest
    needs: lint-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
          ENABLE_SIMULATOR: 'true'
